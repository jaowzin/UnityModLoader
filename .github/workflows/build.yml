name: Build Unity Mod Loader

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

concurrency:
  group: unity-mod-loader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.1"

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Prepare direct APK
        if: steps.build.outcome == 'success'
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" UnityModLoader-latest.apk

      - name: Upload Actions artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: UnityModLoader-debug
          path: UnityModLoader-latest.apk
          if-no-files-found: error

      - name: Publish APK directly in Release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest UnityModLoader-latest.apk --clobber
          else
            gh release create latest UnityModLoader-latest.apk \
              --target "$GITHUB_SHA" \
              --title "Unity Mod Loader - Latest" \
              --notes "Build automática mais recente da branch main. Baixe UnityModLoader-latest.apk diretamente."
          fi

      - name: Persist build result in repository
        if: always()
        run: |
          mkdir -p dist
          cp build.log dist/build.log 2>/dev/null || true
          if [ -f UnityModLoader-latest.apk ]; then
            cp UnityModLoader-latest.apk dist/UnityModLoader-latest.apk
          else
            rm -f dist/UnityModLoader-latest.apk
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if ! git diff --cached --quiet; then
            git commit -m "CI: store latest build result [skip ci]"
            git push
          fi

      - name: Fail workflow if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
