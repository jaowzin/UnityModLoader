name: Build Unity Mod Loader

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: unity-mod-loader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare direct APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" UnityModLoader-latest.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityModLoader-debug
          path: UnityModLoader-latest.apk
          if-no-files-found: error

      - name: Publish APK directly in Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest UnityModLoader-latest.apk --clobber
          else
            gh release create latest UnityModLoader-latest.apk \
              --target "$GITHUB_SHA" \
              --title "Unity Mod Loader - Latest" \
              --notes "Build automática mais recente da branch main. Baixe UnityModLoader-latest.apk diretamente."
          fi
