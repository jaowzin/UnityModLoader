plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.unitymodloader.app'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'dev.unitymodloader.app'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '0.7.3'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra'
            }
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.31.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
